#This workflow is to check IBM Db2 CI/CD on locopy 

name: Db2 CI/CD test
on: 
  workflow_dispatch:
  push:
    branches: [db2-cicd]
  
jobs:
  db2: 
    runs-on: ubuntu-latest
    timeout-minutes: 25 
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Runner info 
        run: | 
          uname -m 
          nproc
          free -g 
      
      #Db2 image requires privilege flag; password generated auto
      - name: Start Db2
        run: |
          PW=$(openssl rand -hex 8)
          echo "::add-mask::$PW"
          echo "DB2_PW=$PW" >> "$GITHUB_ENV"
          date +%s > /tmp/start
          docker run -d --name db2 --privileged=true \
            -p 127.0.0.1:50000:50000 \
            -e LICENSE=accept -e DB2INSTANCE=db2inst1 \
            -e DB2INST1_PASSWORD="$PW" -e DBNAME=testdb \
            -e BLU=false -e TO_CREATE_SAMPLEDB=false \
            -e REPODB=false -e HADR_ENABLED=false \
            icr.io/db2_community/db2
      
      - name: Wait for incoming connections
        run: | 
          for i in $(seq 1 90); do
            if docker exec db2 su - db2inst1 -c "db2 connect to testdb" >/dev/null 2>&1; then
              echo "Ready after $(( $(date +%s) - $(cat /tmp/start) )) seconds"
              exit 0
            fi
            sleep 10
          done
          echo "Db2 not ready"
          docker logs db2 2>&1 | tail -80
          exit 1
      
      - name: Install Python libraries 
        run: python -m pip install . ibm_db pandas
      
      - name: Connect through locopy
        run: | 
          python - <<'EOF'
          import os, ibm_db_dbi
          from locopy import Database
          dsn = "DATABASE=testdb;HOSTNAME=localhost;PORT=50000;PROTOCOL=TCPIP;"
          with Database(dbapi=ibm_db_dbi, dsn=dsn, user="db2inst1", password=os.environ["DB2_PW"]) as db:
              db.execute("SELECT 1 AS id, 'a' AS name FROM SYSIBM.SYSDUMMY1")
              print(db.column_names())
              print(db.to_dict())
              print(db.to_dataframe())
          EOF
      
      - name: Show container logs if failed
        if: failure()
        run: docker logs db2 2>&1 | tail -80

      - name: Remove container 
        if: always() 
        run: docker rm -f db2