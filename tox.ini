[tox]
envlist = mindeps,pandas{23,30,31}
skip_missing_interpreters = true

[testenv]
extras =
    tests
    psycopg2
    pg8000
    snowflake
commands =
    pytest -m "not integration" {posargs}

# Floor corner: oldest supported Python with the lowest pandas that supports
# NumPy 2, the NumPy floor and the pyarrow floor. pandas 2.2.0 is not usable
# here, it declares numpy<2 for python<3.12, so 2.2.3 is the real floor. This
# leg is what catches an undeclared runtime floor like the one pyarrow 26 has
# against NumPy 2, which pip cannot see because pyarrow ships no dependency
# metadata.
[testenv:mindeps]
basepython = python3.11
deps =
    pandas==2.2.3
    numpy==2.0.2
    pyarrow==26.0.1

[testenv:pandas23]
basepython = python3.12
deps = pandas==2.3.3

# snowflake-connector-python has no pandas upper bound as of 5.2.0, so the old
# commands_pre force-install and ignore_outcome are gone and this leg gates.
[testenv:pandas30]
basepython = python3.13
deps = pandas==3.0.5

# Ceiling corner: newest supported Python with the newest pandas the cap allows.
[testenv:pandas31]
basepython = python3.14
deps = pandas==3.1.1
