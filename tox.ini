[tox]
envlist = pandas{15,20,22,23,30}
skip_missing_interpreters = true

[testenv]
extras =
    tests
    psycopg2
    pg8000
    snowflake
commands =
    pytest -m "not integration" {posargs}

[testenv:pandas15]
basepython = python3.11
deps =
    pandas==1.5.3
    numpy<2.0

[testenv:pandas20]
basepython = python3.11
deps =
    pandas==2.0.3
    numpy<2.0

[testenv:pandas22]
basepython = python3.12
deps = pandas==2.2.3

[testenv:pandas23]
basepython = python3.12
deps = pandas==2.3.3

[testenv:pandas30]
basepython = python3.12
commands_pre =
    python -m pip install pandas==3.0.5
ignore_outcome = true
